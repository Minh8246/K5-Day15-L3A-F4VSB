# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Nguồn và giả định của từng đầu vào nằm ngay dưới các giá trị tương ứng.

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 50
  base: 100
  high: 300
  source: "(tự ước tính) Quy mô thử nghiệm với nhân viên văn phòng. Kịch bản cơ sở 100 người khớp với phép tính trong spec.md §2."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.33
    uses_per_month: 0.5
    turns_per_session: 1
    source: "P1 không gặp trong tháng gần nhất. Giả định 1 phiên mỗi 2 tháng và tỷ trọng 33% (tự ước tính)."
  - name: dung_vua
    share: 0.34
    uses_per_month: 2
    turns_per_session: 1
    source: "P2 nhận khoảng 2 tin trong tháng. Giả định mỗi tin tương ứng một phiên và tỷ trọng 34% (tự ước tính)."
  - name: dung_nhieu
    share: 0.33
    uses_per_month: 3
    turns_per_session: 1
    source: "P3 nhận khoảng 3 tin trong tháng. Giả định mỗi tin tương ứng một phiên và tỷ trọng 33% (tự ước tính)."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token, giờ cao điểm, token vào tính theo cache miss
  - model: deepseek-flash
    input: 0.30
    output: 1.20
    source: "https://api-docs.deepseek.com/quick_start/pricing/ · xem 28/11/2026 · giá giờ cao điểm, cache miss"
  - model: deepseek-v4-pro
    input: 1.32
    output: 3.96
    source: "https://api-docs.deepseek.com/quick_start/pricing/ · xem 28/11/2026 · giá giờ cao điểm, cache miss"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
