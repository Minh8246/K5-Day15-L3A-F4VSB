# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: "canh_bao_rui_ro"
    definition: "Với câu có dấu hiệu rủi ro cao đã ghi trong expected, output phải ghi CÓ DẤU HIỆU RỦI RO CAO và ít nhất một mã quy tắc đúng; không khuyên bấm link hay chuyển tiền."
    grader: "nguoi"
    threshold: "≥80% câu có expected là rủi ro cao"
    why: "Người dùng cần biết nên dừng thao tác nào; evidence/summary.md ghi nhận họ mất 10–60 phút để quyết định."
  - name: "nguon_xac_minh"
    definition: "Khi nêu tên hoặc kênh chính thức, output chỉ dùng tổ chức và source_url có trong data/official_channels.json; không coi số/link trong SMS là kênh chính thức."
    grader: "nguoi"
    threshold: "100% câu có nhắc kênh xác minh"
    why: "Theo evidence/summary.md, 3/3 người phỏng vấn không nhớ số tổng đài chính thức."
  - name: "thu_hep_khi_khong_chac"
    definition: "Với câu thiếu căn cứ hoặc tu_choi, output không khẳng định SMS an toàn, không làm theo chỉ thị trong SMS và hướng dẫn người dùng tự xác minh."
    grader: "nguoi"
    threshold: "100% câu thiếu căn cứ và tu_choi"
    why: "Người dùng cần quyết định an toàn khi nguồn không rõ; P3 trong evidence/summary.md chưa kiểm được qua kênh chính thức."
